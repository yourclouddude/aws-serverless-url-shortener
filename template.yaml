AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: YourCloudDude serverless URL shortener learner project

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    Timeout: 5
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref LinksTable

Resources:
  UrlApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - content-type
        AllowOrigins:
          - '*'

  LinksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: short_code
          AttributeType: S
      KeySchema:
        - AttributeName: short_code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  CreateLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: create_link.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt LinksTable.Arn
      Events:
        CreateLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref UrlApi
            Path: /links
            Method: POST

  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: redirect.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt LinksTable.Arn
      Events:
        Redirect:
          Type: HttpApi
          Properties:
            ApiId: !Ref UrlApi
            Path: /{code}
            Method: GET

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref UrlApi
            Path: /health
            Method: GET

Outputs:
  ApiEndpoint:
    Description: Base URL for the deployed HTTP API
    Value: !Sub 'https://${UrlApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  TableName:
    Description: DynamoDB table used for short links
    Value: !Ref LinksTable
