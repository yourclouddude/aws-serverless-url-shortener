name: Feature request
description: Propose an improvement that teaches or improves a real engineering decision
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or learning goal
      description: What limitation, failure mode, or engineering question should this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: What does this add in complexity, cost, IAM surface, latency, or operational burden?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / routing
        - Lambda / application logic
        - DynamoDB / data model
        - IAM / security
        - Observability / operations
        - Infrastructure / SAM
        - Documentation / learning experience
    validations:
      required: true
